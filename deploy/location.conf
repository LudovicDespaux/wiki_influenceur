location = /wiki-influenceur { return 301 /wiki-influenceur/; }
location /wiki-influenceur/ {
    alias /opt/wiki-influenceur/current/;
    index index.html;
    autoindex off;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'none'; style-src 'self'; base-uri 'none'; frame-ancestors 'none'" always;
    add_header Cache-Control "no-cache" always;
}
