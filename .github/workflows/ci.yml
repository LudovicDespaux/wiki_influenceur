name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    name: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: bash -n deploy/deploy-vps.sh deploy/activate-release.sh
      - run: shellcheck deploy/*.sh
