name: Require CodeRabbit review
on:
  workflow_call:
permissions:
  contents: read
  pull-requests: read
  statuses: read
jobs:
  review:
    name: CodeRabbit review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Wait for completed review of current commit
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request
          repository = os.environ['GITHUB_REPOSITORY']
          number = os.environ['PR_NUMBER']
          sha = os.environ['PR_SHA']
          def get(path):
              request = urllib.request.Request('https://api.github.com/' + path, headers={
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
              })
              with urllib.request.urlopen(request, timeout=20) as response:
                  return json.load(response)
          def completed_status(statuses):
              trusted = [s for s in statuses if s.get('context') == 'CodeRabbit'
                         and (s.get('creator') or {}).get('login') == 'coderabbitai[bot]'
                         and (s.get('creator') or {}).get('type') == 'Bot']
              if not trusted:
                  return False
              latest = max(trusted, key=lambda s: s['id'])
              return latest['state'] == 'success' and latest.get('description') == 'Review completed'
          for attempt in range(30):
              pr = get(f'repos/{repository}/pulls/{number}')
              if pr['head']['sha'] != sha:
                  raise SystemExit('PR changed; a new workflow must validate the new commit.')
              reviews = []
              page = 1
              while True:
                  batch = get(f'repos/{repository}/pulls/{number}/reviews?per_page=100&page={page}')
                  reviews.extend(batch)
                  if len(batch) < 100:
                      break
                  page += 1
              matching = [r for r in reviews if r['user']['login'] == 'coderabbitai[bot]'
                          and r['user']['type'] == 'Bot' and r['commit_id'] == sha
                          and r['state'] in ('APPROVED', 'COMMENTED', 'CHANGES_REQUESTED')]
              if matching:
                  latest = max(matching, key=lambda r: r['id'])
                  if latest['state'] == 'CHANGES_REQUESTED':
                      raise SystemExit('CodeRabbit requested changes; fix them and request another review.')
                  print('Completed CodeRabbit review: ' + latest['html_url'])
                  break
              # Clean reviews may only publish a commit status, not a PR review.
              statuses = get(f'repos/{repository}/commits/{sha}/statuses?per_page=100')
              if completed_status(statuses):
                  print('CodeRabbit completed its review of ' + sha)
                  break
              print(f'Waiting for CodeRabbit on {sha}, attempt {attempt + 1}/30', flush=True)
              time.sleep(30)
          else:
              raise SystemExit('No completed CodeRabbit review for this commit within 15 minutes. Retry after review.')
          PY
